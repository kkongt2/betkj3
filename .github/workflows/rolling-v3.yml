name: Prepare and validate rolling v3
on:
  push:
    branches: ['feature/rolling-v3']
    paths: ['scripts/**', 'tests/rolling*.cjs', '.github/workflows/rolling-v3.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rolling-v3-research
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kkongt2/timeline
          ref: main
          path: _seed
          sparse-checkout: |
            training
            scripts/model-research
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4 charset-normalizer
      - run: python tests/rolling-features.py
      - run: python scripts/prepare-weighted-v3.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and validate model data
        run: |
          node tests/tuning.cjs
          node tests/presets.cjs
          node scripts/build-qpl-history.cjs
          node tests/rolling-model.cjs
      - name: Rolling training and venue comparison
        run: |
          g++ -O3 -fopenmp -std=c++17 scripts/search-v3.cpp -o /tmp/search-v3
          node scripts/rolling-search.cjs
          node tests/rolling-report.cjs
      - name: Preserve reproducible feature snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add history/weighted-v3.jsonl.gz history/weighted-source.jsonl.gz data qpl-history.json qpl-history-years rolling-report.json research
          if ! git diff --cached --quiet; then
            git commit -m 'Build prior-date weighted v2 features and documented coverage'
            git pull --rebase origin feature/rolling-v3
            git push origin HEAD:feature/rolling-v3
          fi

