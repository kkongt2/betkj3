name: Verify joint selection before publishing
on:
  push:
    branches: ['feature/joint-selection']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check models, time separation and persistence
        run: |
          node --check app.js
          node tests/joint-search.cjs
          node tests/race-selection.cjs
          node tests/weight-search.cjs
          node tests/weight-curves.cjs
          node tests/site.cjs
      - name: Check mobile worker and fallback
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
          node tests/race-selection-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screening-mobile
          path: /tmp/screening-*.png
