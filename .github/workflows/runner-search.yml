name: Runner weight search
run-name: Runner search · ${{ github.actor }} · ${{ fromJSON(inputs.request).requestId }}
on:
  workflow_dispatch:
    inputs:
      request:
        description: '사이트에서 복사한 탐색 조건(JSON)을 붙여넣으세요'
        required: true
        type: string
permissions:
  contents: read
jobs:
  search1:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Search segment 1
        env:
          SEARCH_REQUEST: ${{ inputs.request }}
        run: node scripts/runner-search.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: runner-search-state-1
          path: _runner-out/result.json
          retention-days: 14
  search2:
    needs: search1
    if: ${{ needs.search1.result == 'success' && fromJSON(inputs.request).seconds > 18000 }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: runner-search-state-1
          path: _runner-prev
      - name: Search segment 2
        env:
          SEARCH_REQUEST: ${{ inputs.request }}
          PREVIOUS_RESULT: _runner-prev/result.json
        run: node scripts/runner-search.cjs
      - uses: actions/upload-artifact@v4
