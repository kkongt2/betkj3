name: Sync race data and publish betkj3
on:
  push:
    branches: [main]
    paths-ignore: ['data/**', 'qpl-history.json', 'qpl-history-years/**', 'history/**', 'rolling-report.json', 'top5-presets.json']
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '7,27,47 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: betkj3-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          repository: kkongt2/timeline
          ref: kra-mobile-pages
          path: _source
          sparse-checkout: data
          persist-credentials: false
      - name: Copy the complete race archive
        run: |
          mkdir -p data
          rsync -a --delete --filter='protect /calendar/***' --filter='protect /market-odds/***' _source/data/ data/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: actions/checkout@v4
        with:
          repository: kkongt2/timeline
          ref: main
          path: _seed
          sparse-checkout: |
            training
            scripts/model-research
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4 charset-normalizer
      - run: python scripts/seoul-only.py
      - run: python tests/rolling-features.py
      - run: python tests/last5-features.py
      - run: python scripts/prepare-weighted-v3.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate strategy and race archive
        run: |
          node --check app.js
          node tests/qpl-policy.cjs
          node scripts/build-qpl-history.cjs
          node scripts/refresh-rolling.cjs
          node tests/seoul.cjs
          node tests/site.cjs
          node tests/archive.cjs
          node tests/seoul-report.cjs
      - name: Preserve computed history for branch and workflow deployments
        run: |
          git add -A rolling-report.json data history qpl-history.json qpl-history-years
          if ! git diff --cached --quiet; then
            git commit -m "Update historical QPL range evaluation data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html style.css app.js model.js qpl-policy.js tuning-model.js qpl-history-engine.js qpl-history-worker.js qpl-history.json strategy-presets.js rolling-panel.js rolling-report.json top5-panel.js top5-presets.json _site/
          cp -R data _site/data
          cp -R qpl-history-years _site/qpl-history-years
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published model and controls
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict');
          (async()=>{
            const base=process.env.SITE_URL,stamp=Date.now();
            const read=async path=>{const r=await fetch(new URL(path+'?verify='+stamp,base));assert(r.ok,path+' HTTP '+r.status);return r.text();};
            const [html,model,history]=await Promise.all([read('index.html'),read('tuning-model.js'),read('qpl-history.json')]);
            assert(html.includes('weight-16'));assert(html.includes('평균 적중 배당'));assert(model.includes('user-weighted-seoul-last5-v2'));
            const manifest=JSON.parse(history);assert.equal(manifest.scope,'seoul');assert(manifest.races>4000);const live=JSON.parse(await read('data/latest.json'));assert.equal(live.scope,'seoul');assert(live.races.every(r=>r.venue==='seoul'));assert(live.calendar.every(d=>d.venues.every(v=>v==='seoul')));assert(!/부경|제주|전국|weightVenue/.test(html));for(const shard of manifest.shards){const d=JSON.parse(await read(shard.url));assert(d.rows.every(r=>r.venue==='seoul'));}const rolling=JSON.parse(await read('rolling-report.json'));assert.equal(rolling.scope,'seoul');assert(rolling.folds.length>=4);assert(rolling.selected.all.evaluated>=Math.ceil(rolling.selected.all.total*.4));
            const top5=JSON.parse(await read('top5-presets.json'));assert.equal(top5.scope,'seoul');assert.equal(top5.presets.length,15);assert(html.includes('top5Presets'));assert(top5.presets.every(p=>p.all.evaluated>=Math.ceil(top5.sourceRaces*.4)&&p.all.hits*20>=p.all.evaluated*3));
            console.log('PASS published Seoul-only controls, model, live calendar, every historical shard and quarterly report',base);
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE

