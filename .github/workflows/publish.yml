name: Sync race data and publish betkj3
on:
  push:
    branches: [main]
    paths-ignore: ['data/**', 'qpl-history.json', 'qpl-history-years/**', 'history/**']
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '7,27,47 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: betkj3-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          repository: kkongt2/timeline
          ref: kra-mobile-pages
          path: _source
          sparse-checkout: data
          persist-credentials: false
      - name: Copy the complete race archive
        run: |
          mkdir -p data
          rsync -a --delete --filter='protect /calendar/***' --filter='protect /market-odds/***' _source/data/ data/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Sync official race cards, final place odds and model data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate strategy and race archive
        run: |
          node --check app.js
          node tests/qpl-policy.cjs
          node tests/site.cjs
          node tests/tuning.cjs
          node tests/presets.cjs
          node scripts/build-qpl-history.cjs
          node tests/archive.cjs
      - name: Preserve computed history for branch and workflow deployments
        run: |
          git add qpl-history.json qpl-history-years
          if ! git diff --cached --quiet; then
            git commit -m "Update historical QPL range evaluation data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html style.css app.js model.js model-v7.js qpl-policy.js tuning-model.js qpl-history-engine.js qpl-history-worker.js qpl-history.json strategy-presets.js strategy-search.json _site/
          cp -R data _site/data
          cp -R qpl-history-years _site/qpl-history-years
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
