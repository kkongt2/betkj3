name: Prepare and validate weighted v2
on:
  push:
    branches: ['feature/weighted-v2']
    paths: ['scripts/prepare-weighted-v2.py', 'tests/weighted-features.py', '.github/workflows/weighted-v2.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: weighted-v2-research
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kkongt2/timeline
          ref: main
          path: _seed
          sparse-checkout: |
            training
            scripts/model-research
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4 charset-normalizer
      - run: python tests/weighted-features.py
      - run: python scripts/prepare-weighted-v2.py
      - name: Preserve reproducible feature snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add history/weighted-v2.jsonl.gz history/weighted-source.jsonl.gz data
          if ! git diff --cached --quiet; then
            git commit -m 'Build prior-date weighted v2 features and documented coverage'
            git pull --rebase origin feature/weighted-v2
            git push origin HEAD:feature/weighted-v2
          fi
